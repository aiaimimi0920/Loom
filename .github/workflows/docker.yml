name: Docker

on:
  push:
    paths:
      - .github/workflows/docker.yml
      - Dockerfile
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - apps/**
      - crates/**
      - examples/**
  pull_request:
    paths:
      - .github/workflows/docker.yml
      - Dockerfile
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - apps/**
      - crates/**
      - examples/**
  workflow_dispatch:

concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write

jobs:
  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # This image is loaded only into the ephemeral runner for Trivy; formal
      # release provenance and SBOMs are generated by the release workflow.
      - name: Build Loom CI scan image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: loom-ci:scan
          provenance: false
          sbom: false

      # Pin the action commit because mutable Trivy tags were compromised in March 2026.
      - name: Scan Loom CI image
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: loom-ci:scan
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true

      - name: Upload Trivy results to GitHub Code Scanning
        if: always() && steps.trivy.outcome != 'skipped'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Enforce Trivy vulnerability gate
        if: always() && steps.trivy.outcome == 'failure'
        run: exit 1
