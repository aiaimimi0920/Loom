name: Docker

on:
  push:
    paths:
      - Dockerfile
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - apps/**
      - crates/**
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - apps/**
      - crates/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build Loom CI image
        run: docker build -t loom-ci .
