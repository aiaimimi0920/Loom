name: Docker

on:
  push:
    paths:
      - .github/workflows/docker.yml
      - Dockerfile
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - apps/**
      - crates/**
  pull_request:
    paths:
      - .github/workflows/docker.yml
      - Dockerfile
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - apps/**
      - crates/**
  workflow_dispatch:

concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write

jobs:
  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          path: Project/Loom

      - name: Checkout Neuro UI
        uses: actions/checkout@v5
        with:
          repository: aiaimimi0920/NeuroDesign
          ref: 02420e8d129cf952c6bee3cda96ab7ebc95c2d67
          path: nas_home/NeuroDesign
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.2"

      - name: Setup npm
        run: npm install --global npm@11.21.1 --no-audit --no-fund

      - name: Build Neuro UI library
        working-directory: nas_home/NeuroDesign
        run: npm ci --no-audit --no-fund && node scripts/build.mjs --library --theme neuro

      - name: Build Web management assets
        working-directory: Project/Loom/apps/desktop
        run: npm ci --no-audit --no-fund && npm run build:web

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # This image is loaded only into the ephemeral runner for Trivy; formal
      # release provenance and SBOMs are generated by the release workflow.
      - name: Build Loom CI scan image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: Project/Loom
          load: true
          push: false
          tags: loom-ci:scan
          provenance: false
          sbom: false

      # Pin the action commit because mutable Trivy tags were compromised in March 2026.
      - name: Scan Loom CI image
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: loom-ci:scan
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true

      - name: Upload Trivy results to GitHub Code Scanning
        if: always() && steps.trivy.outcome != 'skipped'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Enforce Trivy vulnerability gate
        if: always() && steps.trivy.outcome == 'failure'
        run: exit 1
