name: Docker

on:
  push:
    paths:
      - Dockerfile
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - apps/**
      - crates/**
      - examples/**
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - apps/**
      - crates/**
      - examples/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Loom CI image with provenance and SBOM
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: loom-ci:scan
          provenance: mode=max
          sbom: true

      - name: Scan Loom CI image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: loom-ci:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
