name: Release Tag

on:
  push:
    tags:
      - 'V*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish manually
        required: true
        type: string

concurrency:
  group: release-tag-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  dependency-security:
    name: Verify release dependency security
    uses: ./.github/workflows/dependency-security.yml
    with:
      checkout-ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
    permissions:
      actions: read
      contents: read
      security-events: write

  release:
    name: Build and publish Loom release
    needs: dependency-security
    runs-on: windows-latest
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.2"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target

      - name: Resolve and validate release tag
        shell: powershell
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") { $env:REQUESTED_TAG } else { $env:GITHUB_REF_NAME }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "Release tag is required."
          }
          if ($tag -notmatch '^V\d+\.\d+\.\d+$') {
            throw "Release tag must match Vx.x.x. Received: $tag"
          }
          "LOOM_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check release publication state
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          LOOM_TAG: ${{ env.LOOM_TAG }}
        with:
          script: |
            const publication = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/release-publication.cjs`);
            await publication.assertReleaseAbsent({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: process.env.LOOM_TAG,
            });

      - name: Build standalone Loom release
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          & .\scripts\Invoke-CiCommand.ps1 `
            -Title "Tagged Loom build failed" `
            -Executable "powershell" `
            -CommandArguments @(
              "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", ".\scripts\build-release.ps1",
              "-VersionId", $env:LOOM_TAG, "-OutputRoot", ".\release\Loom", "-RequireCleanSource"
            )

      - name: Verify and smoke standalone Loom release
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          & .\scripts\Invoke-CiCommand.ps1 `
            -Title "Tagged Loom verification failed" `
            -Executable "powershell" `
            -CommandArguments @(
              "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", ".\scripts\verify-release.ps1",
              "-PackageDir", ".\release\Loom\$env:LOOM_TAG", "-RunSmoke", "-RequireCleanSource"
            )

      - name: Attest release build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/Loom/${{ env.LOOM_TAG }}/packages/*.zip

      - name: Attest release SBOM
        uses: actions/attest-sbom@v2
        with:
          subject-path: release/Loom/${{ env.LOOM_TAG }}/packages/Loom-${{ env.LOOM_TAG }}-windows-x64.zip
          sbom-path: release/Loom/${{ env.LOOM_TAG }}/sbom/Loom-${{ env.LOOM_TAG }}.cdx.json

      - name: Create verified draft release
        id: draft-release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          token: ${{ github.token }}
          tag_name: ${{ env.LOOM_TAG }}
          name: ${{ env.LOOM_TAG }}
          draft: true
          generate_release_notes: true
          files: |
            release/Loom/${{ env.LOOM_TAG }}/packages/Loom-${{ env.LOOM_TAG }}-windows-x64.zip
            release/Loom/${{ env.LOOM_TAG }}/packages/Loom-${{ env.LOOM_TAG }}-windows-x64.zip.sha256
            release/Loom/${{ env.LOOM_TAG }}/packages/Loom-CLI-${{ env.LOOM_TAG }}-windows-x64.zip
            release/Loom/${{ env.LOOM_TAG }}/packages/Loom-CLI-${{ env.LOOM_TAG }}-windows-x64.zip.sha256
            release/Loom/${{ env.LOOM_TAG }}/packages/Loom-Plugin-SDK-${{ env.LOOM_TAG }}-windows-x64.zip
            release/Loom/${{ env.LOOM_TAG }}/packages/Loom-Plugin-SDK-${{ env.LOOM_TAG }}-windows-x64.zip.sha256
            release/Loom/${{ env.LOOM_TAG }}/sbom/*.json
            release/Loom/${{ env.LOOM_TAG }}/provenance/*.json
            release/Loom/${{ env.LOOM_TAG }}/manifest.json
            release/Loom/${{ env.LOOM_TAG }}/checksums.sha256
          fail_on_unmatched_files: true

      - name: Verify assets and publish draft release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          LOOM_PACKAGE_DIRECTORY: release/Loom/${{ env.LOOM_TAG }}
          LOOM_RELEASE_ID: ${{ steps.draft-release.outputs.id }}
          LOOM_TAG: ${{ env.LOOM_TAG }}
        with:
          script: |
            const publication = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/release-publication.cjs`);
            await publication.publishVerifiedDraft({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              releaseId: process.env.LOOM_RELEASE_ID,
              tag: process.env.LOOM_TAG,
              packageDirectory: process.env.LOOM_PACKAGE_DIRECTORY,
            });

      - name: Remove failed draft release
        if: failure() && steps.draft-release.outputs.id != ''
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          LOOM_RELEASE_ID: ${{ steps.draft-release.outputs.id }}
          LOOM_TAG: ${{ env.LOOM_TAG }}
        with:
          script: |
            const publication = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/release-publication.cjs`);
            const deleted = await publication.deleteFailedDraft({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              releaseId: process.env.LOOM_RELEASE_ID,
              tag: process.env.LOOM_TAG,
            });
            if (!deleted) core.warning('No matching unpublished draft was deleted.');
