name: Build Windows

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - ".github/workflows/build-windows.yml"
      - "scripts/smoke-release.ps1"
      - "scripts/smoke-release/**"
      - "scripts/framework-art-store-otter-smoke/**"
      - "scripts/tests/Test-FrameworkArtStoreOtterSmokeModules.ps1"
      - "scripts/tests/Test-FrameworkSmokeCleanup.ps1"
      - "scripts/tests/Test-McpSmokeDiagnostics.ps1"
      - "scripts/tests/Test-SmokeReleaseModules.ps1"
      - "scripts/tests/Test-StandaloneReleaseContract.ps1"
      - "scripts/tests/standalone-release/**"
      - "crates/loom_mcp/**"
      - "crates/loom_process/**"
      - "apps/daemon/src/runtime/mcp*.rs"
      - "apps/daemon/src/runtime/route_dispatch/mcp_art.rs"
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and verify Windows candidate
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Project/Loom
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          path: Project/Loom
          persist-credentials: false

      - name: Checkout Neuro UI source
        uses: actions/checkout@v5
        with:
          repository: aiaimimi0920/NeuroDesign
          ref: 02420e8d129cf952c6bee3cda96ab7ebc95c2d67
          path: nas_home/NeuroDesign
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.2"

      - name: Setup npm
        run: npm install --global npm@11.21.1 --no-audit --no-fund

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            Project/Loom -> target
            Project/Loom/apps/desktop/src-tauri -> target

      - name: Resolve CI version
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $shortSha = $env:GITHUB_SHA.Substring(0, 8)
          "LOOM_VERSION=ci-$env:GITHUB_RUN_NUMBER-$shortSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Test bounded MCP smoke diagnostics
        shell: powershell
        run: .\scripts\tests\Test-McpSmokeDiagnostics.ps1

      - name: Test framework process cleanup
        shell: powershell
        run: .\scripts\tests\Test-FrameworkSmokeCleanup.ps1

      - name: Install Neuro UI dependencies
        working-directory: nas_home/NeuroDesign
        run: npm ci --no-audit --no-fund

      - name: Build Neuro UI library
        working-directory: nas_home/NeuroDesign
        run: node scripts/build.mjs --library --theme neuro

      - name: Build standalone Loom release
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          & .\scripts\Invoke-CiCommand.ps1 `
            -Title "Standalone Loom build failed" `
            -Executable "powershell" `
            -CommandArguments @(
              "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", ".\scripts\build-release.ps1",
              "-VersionId", $env:LOOM_VERSION, "-OutputRoot", ".\release\Loom", "-RequireCleanSource"
            )

      - name: Build authenticated native smoke probe
        shell: powershell
        run: cargo build --locked -p loom_local_channel --example bridge_probe

      - name: Verify standalone Loom release
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          & .\scripts\Invoke-CiCommand.ps1 `
            -Title "Standalone Loom verification failed" `
            -Executable "powershell" `
            -CommandArguments @(
              "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", ".\scripts\verify-release.ps1",
              "-PackageDir", ".\release\Loom\$env:LOOM_VERSION", "-RunSmoke", "-RequireCleanSource"
            )

      - name: Upload bounded smoke phase diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: loom-windows-smoke-diagnostics-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            Project/Loom/target/runtime-smoke/latest/mcp-smoke-diagnostic.json
            Project/Loom/target/runtime-smoke/plugin-boundary/plugin-boundary-diagnostic.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Windows candidate
        uses: actions/upload-artifact@v6
        with:
          name: loom-windows-x64-${{ github.sha }}
          path: Project/Loom/release/Loom/${{ env.LOOM_VERSION }}
          if-no-files-found: error
