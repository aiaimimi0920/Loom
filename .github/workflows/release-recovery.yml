name: Release Recovery

on:
  workflow_run:
    workflows:
      - Release Tag
    types:
      - completed

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: release-recovery-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  recover:
    name: Diagnose and recover release run
    runs-on: ubuntu-latest
    steps:
      # workflow_run has a write-capable token, so execute automation only from the trusted default branch.
      - name: Checkout trusted recovery code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Record failure or close recovered incident
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const recovery = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/release-recovery.cjs`);
            await recovery.run({ github, context, core });
