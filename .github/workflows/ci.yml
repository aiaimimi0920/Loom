name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows full validation
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The effective-line ratchet verifies its recorded source commit and tree.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Test effective-code-line checker
        run: node --test .\scripts\tests\effective-code-lines.test.mjs

      - name: Test GitHub release and dependency triage automation
        run: node --test .\scripts\tests\dependabot-triage.test.cjs .\scripts\tests\github-release-automation.test.cjs

      - name: Enforce effective-code-line migration ratchet
        run: node .\scripts\effective-code-lines.mjs --mode ratchet --json artifacts/effective-code-lines.json

      - name: Upload effective-code-line report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: loom-effective-code-lines
          path: artifacts/effective-code-lines.json
          if-no-files-found: warn

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
            framework-packages/runtime-host -> target

      - name: Validate standalone layout before generated output
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\tests\Test-StandaloneLayout.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\tests\Test-StandaloneReleaseContract.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\tests\Test-FrameworkArtStoreHookSmokeModules.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\tests\Test-SmokeReleaseModules.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\tests\Test-ReleaseIntegrityTamper.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\tests\Test-HookCanvasUiContract.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\tests\Test-DevelopmentManualContract.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\tests\Test-DependencySecurityContract.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\tests\Test-GitHubActionsContract.ps1

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci --no-audit --no-fund

      - name: Format Rust workspace
        run: cargo fmt --all -- --check

      - name: Check Rust workspace
        run: cargo check --locked --workspace --all-targets

      - name: Test Rust workspace
        run: cargo test --locked --workspace

      - name: Typecheck desktop frontend
        working-directory: apps/desktop
        run: npm run typecheck

      - name: Test desktop frontend services
        working-directory: apps/desktop
        run: npm test

      - name: Build desktop frontend
        working-directory: apps/desktop
        run: npm run build

      - name: Check Tauri wrapper
        run: cargo check --locked --all-targets --manifest-path .\apps\desktop\src-tauri\Cargo.toml

      - name: Format Tauri wrapper
        run: cargo fmt --manifest-path .\apps\desktop\src-tauri\Cargo.toml -- --check

      - name: Test Tauri wrapper
        run: cargo test --locked --manifest-path .\apps\desktop\src-tauri\Cargo.toml

      # The runtime host is a detached manifest, so every --workspace step above skips it. It holds
      # the MCP bridge, the Surface binding root check and the bounded-recursion guard, none of
      # which any other job compiles.
      - name: Format framework runtime host
        run: cargo fmt --manifest-path .\framework-packages\runtime-host\Cargo.toml -- --check

      - name: Check framework runtime host
        run: cargo check --locked --all-targets --manifest-path .\framework-packages\runtime-host\Cargo.toml

      - name: Test framework runtime host
        run: cargo test --locked --manifest-path .\framework-packages\runtime-host\Cargo.toml

      - name: Run focused PowerShell contracts
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\Test-LoomRunPersistenceSmokeContract.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\Test-LoomDaemonConcurrencySmokeContract.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\tests\Test-LoomSampleArtPackageContract.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\tests\Test-LoomSampleArtInstallExecutionContract.ps1

  linux:
    name: Linux Rust validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends pkg-config libssl-dev

      - name: Format Rust workspace
        run: cargo fmt --all -- --check

      - name: Check Rust workspace
        run: cargo check --locked --workspace --all-targets

      - name: Test Rust workspace
        run: cargo test --locked --workspace

  plugin-security:
    name: Clean-host plugin security (${{ matrix.case }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        case:
          - archive
          - signature
          - dependency
          - network
          - process
          - lifecycle
    steps:
      - name: Checkout clean host
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Run malicious plugin package matrix
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\tests\Test-MaliciousPluginPackages.ps1 -Case "${{ matrix.case }}"

  plugin-sdk-clean-host:
    name: Clean-host plugin SDK and schema validation
    runs-on: windows-latest
    steps:
      - name: Checkout clean host
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Test plugin CLI end to end
        run: cargo test --locked -p loom-plugin-cli cli_sign_trust_pack_install_conformance_and_revoke_e2e

      - name: Validate embedded public schemas
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($schema in @("framework-manifest", "execute-request", "execute-response", "authoring", "art-runtime")) {
            cargo run --locked -p loom-plugin-cli --bin loom-plugin -- schema $schema | ConvertFrom-Json | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Schema validation failed: $schema" }
          }
