name: Plugin Boundary Diagnostics

on:
  pull_request:
    paths:
      - ".github/workflows/plugin-boundary-diagnostics.yml"
      - ".github/workflows/build-windows.yml"
      - "scripts/Invoke-LoomPluginBoundarySmoke.ps1"
      - "scripts/plugin-boundary-smoke/**"
      - "scripts/NativeBridgeProbe.ps1"
      - "crates/loom_local_channel/**"
      - "scripts/tests/Test-PluginBoundary*.ps1"
      - "scripts/tests/Test-NativeBridgeProbeCleanup.ps1"
      - "scripts/tests/plugin-boundary/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/plugin-boundary-diagnostics.yml"
      - ".github/workflows/build-windows.yml"
      - "scripts/Invoke-LoomPluginBoundarySmoke.ps1"
      - "scripts/plugin-boundary-smoke/**"
      - "scripts/NativeBridgeProbe.ps1"
      - "crates/loom_local_channel/**"
      - "scripts/tests/Test-PluginBoundary*.ps1"
      - "scripts/tests/Test-NativeBridgeProbeCleanup.ps1"
      - "scripts/tests/plugin-boundary/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-boundary-diagnostics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnostics:
    name: Native TLS and PowerShell 5.1 diagnostics
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify diagnostic artifact contract
        shell: powershell
        run: .\scripts\tests\Test-PluginBoundarySmokeContract.ps1
      - name: Exercise native TLS and bounded message transport
        shell: powershell
        run: |
          cargo test --locked -p loom_local_channel --features server
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p loom_local_channel --example bridge_probe --features server
      - name: Exercise native facade and redacted diagnostics
        shell: powershell
        run: .\scripts\tests\Test-PluginBoundaryDiagnostics.ps1
      - name: Preserve primary failures through real main cleanup
        shell: powershell
        run: .\scripts\tests\Test-PluginBoundaryCleanup.ps1
      - name: Keep native probe cleanup retryable
        shell: powershell
        run: .\scripts\tests\Test-NativeBridgeProbeCleanup.ps1
