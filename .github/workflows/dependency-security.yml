name: Dependency Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "30 18 * * 0"
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout-ref:
        description: Exact branch, tag, or commit to scan
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  osv:
    name: Scan committed dependency locks
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@ffa0a5f39214d80778c9b494822d94d0d9668458 # v2.5.0 wrapper; scanner action is pinned in policy
    with:
      ref: ${{ inputs.checkout-ref || github.ref }}
      scan-args: |-
        --config=./security/osv-scanner.toml
        --lockfile=./Cargo.lock
        --lockfile=./apps/desktop/src-tauri/Cargo.lock
        --lockfile=./framework-packages/runtime-host/Cargo.lock
        --lockfile=./apps/desktop/package-lock.json
      upload-sarif: false
      fail-on-vuln: true
    permissions:
      actions: read
      contents: read
