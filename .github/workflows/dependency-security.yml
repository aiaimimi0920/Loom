name: Dependency Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "30 18 * * 0"
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout-ref:
        description: Exact branch, tag, or commit to scan
        required: false
        type: string

concurrency:
  group: dependency-security-${{ github.event.pull_request.number || inputs.checkout-ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  osv:
    name: Scan committed dependency locks
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@0c58c542420dfd23fcac08dd9c8ca3cca9c36f1a # v2.5.0 wrapper; scanner action is pinned in policy
    with:
      ref: ${{ inputs.checkout-ref || github.ref }}
      scan-args: |-
        --config=./security/osv-scanner.toml
        --lockfile=./Cargo.lock
        --lockfile=./apps/desktop/src-tauri/Cargo.lock
        --lockfile=./framework-packages/runtime-host/Cargo.lock
        --lockfile=./apps/desktop/package-lock.json
      upload-sarif: true
      fail-on-vuln: true
    permissions:
      actions: read
      contents: read
      security-events: write
