name: 图片融合并压缩
nodes:
  - id: blend
    uses: custom-image-blend-script
    with:
      mix_ratio: 50

  - id: compress
    uses: custom-1770146354922
    needs:
      - blend
    with:
      input: ${{ nodes.blend.outputs.output_base64 }}
      level_num: 2
      quality_num: 90
      lossless: false
