[package]
name = "loom-framework-runtime-host"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "External process host for independently packaged Loom Art frameworks"

[workspace]

[dependencies]
base64 = "0.22"
loom_mcp = { path = "../../crates/loom_mcp" }
loom_protocol = { path = "../../crates/loom_protocol" }
loom_process = { path = "../../crates/loom_process" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
